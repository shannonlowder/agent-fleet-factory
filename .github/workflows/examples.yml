name: examples

on:
  pull_request:
    paths:
      - "examples/**"
      - ".github/workflows/examples.yml"
  push:
    branches: [main]
    paths:
      - "examples/**"
      - ".github/workflows/examples.yml"

permissions:
  contents: read

jobs:
  fleet-on-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: make -C examples/fleet-on-kind smoke
