name: book

on:
  pull_request:
    paths:
      - "book/**"
      - "examples/**"
      - ".github/workflows/book.yml"
  push:
    branches: [main]
    paths:
      - "book/**"
      - "examples/**"
      - ".github/workflows/book.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
        env:
          # quarto looks up the latest TinyTeX release via the GitHub API; unauthenticated calls get 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render book
        run: quarto render book
      - name: Assert HTML, PDF and EPUB outputs exist
        run: |
          ls -l book/_book
          for ext in html pdf epub; do
            if ! find book/_book -maxdepth 1 -name "*.$ext" | grep -q .; then
              echo "::error::no .$ext in book/_book"
              exit 1
            fi
          done
      - name: Assert the example listing was included
        run: |
          # The stub chapter includes examples/fleet-on-kind/kind-config.yaml by path.
          # Check its content reached the rendered HTML, not just that the build passed.
          grep -rl "kind.x-k8s.io/v1alpha4" book/_book --include='*.html' | grep -q . \
            || { echo "::error::included listing not found in rendered HTML"; exit 1; }
