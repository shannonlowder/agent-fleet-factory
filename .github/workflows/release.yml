name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Landscape page searched within 30 days
        # docs/sourcing.md rule 6: re-search the landscape before each release (issue 67).
        run: python3 scripts/check_landscape_date.py

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
        env:
          # quarto looks up the latest TinyTeX release via the GitHub API; unauthenticated calls get 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render book
        run: quarto render book

      - name: Zip site
        run: |
          cd book/_book
          zip -r ../../site.zip . -x '*.pdf' '*.epub'
          cd ../..
          mv site.zip book/_book/site.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # v0.* are test pre-releases; v1.* and later are prod editions.
          flags=()
          case "$TAG" in
            v0.*) flags+=(--prerelease) ;;
          esac
          shopt -s nullglob
          assets=(book/_book/*.pdf book/_book/*.epub book/_book/site.zip)
          gh release create "$TAG" "${assets[@]}" \
            --title "$TAG" --generate-notes "${flags[@]}"
