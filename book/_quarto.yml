project:
  type: book
  output-dir: _book

book:
  title: "[Working name]"
  author: "Shannon Lowder"
  # Fixed file name for the PDF/EPUB, so release assets don't depend on the title
  # (brackets in "[Working name]" broke the release upload as a glob).
  output-file: "agent-fleet-factory"
  chapters:
    - index.qmd
    - chapters/01-from-prompting-to-a-factory/index.qmd
    - chapters/02-your-first-fleet-on-kind/index.qmd
    - chapters/03-the-model-is-not-the-agent/index.qmd
    - chapters/04-the-harness-beats-the-model/index.qmd
    - chapters/05-the-environment-agents-work-in/index.qmd
    - chapters/06-identity-credentials-grants/index.qmd
    - chapters/07-defining-the-work/index.qmd
    - chapters/08-knowing-its-done/index.qmd
    - chapters/09-dividing-the-work/index.qmd
    - chapters/10-humans-where-they-add-value/index.qmd
    - chapters/11-measuring-the-factory/index.qmd
    - chapters/12-changing-a-running-factory/index.qmd

format:
  html:
    theme: cosmo
  pdf:
    documentclass: scrbook
  epub: default

# Licence note shown in the front matter.
license: "CC BY 4.0"

# Local filter: includes a file into a code block by path and fails the build
# if the file is missing (the quarto-ext extension only warns and skips).
filters:
  - filters/include-file.lua
